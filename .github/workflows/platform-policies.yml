name: platform-policies

on:
  workflow_dispatch:

jobs:
  # ─── PROD: plan ───────────────────────────────────────────────────────────
  plan:
    runs-on: [self-hosted]
    environment: TENANT-PLAN

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      - name: Build plan
        shell: pwsh
        run: |
          Build-DeploymentPlans `
            -definitionsRootFolder "." `
            -outputFolder "./Output" `
            -pacEnvironment "tenant01"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output
          retention-days: 1

  # ─── PROD: deploy policies ────────────────────────────────────────────────
  deploy-policy:
    needs: plan
    runs-on: [self-hosted]
    environment: TENANT-DEPLOY-POLICY

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      - name: Deploy policy plan
        shell: pwsh
        run: Deploy-PolicyPlan -inputFolder "./Output" -pacEnvironment "tenant01"

  # ─── PROD: deploy roles ───────────────────────────────────────────────────
  deploy-roles:
    needs: deploy-policy
    runs-on: [self-hosted]
    environment: TENANT-DEPLOY-ROLES

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      - name: Deploy roles plan
        shell: pwsh
        run: Deploy-RolesPlan -inputFolder "./Output" -pacEnvironment "tenant01"
