name: platform-policies

# Triggered manually from the GitHub Actions UI.
# Three sequential jobs — each requires human approval via its GitHub environment gate
# before proceeding. Nothing is deployed until a reviewer approves.
on:
  workflow_dispatch:

jobs:
  # ─── JOB 1: PLAN ──────────────────────────────────────────────────────────
  # Reads all .jsonc files under platform/policies/ and compares them against
  # what is currently deployed in Azure. Produces a plan (create/update/delete)
  # but makes NO changes to Azure. The plan is uploaded as an artifact so the
  # next jobs can use it without re-running the comparison.
  plan:
    runs-on: [self-hosted]
    environment: TENANT-PLAN

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      # Authenticates using the VM's managed identity — no client secret needed.
      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      # EPAC reads:
      #   global-settings.jsonc          → tenant ID, root MG scope, managed identity region
      #   policy-definitions/**/*.jsonc  → custom policy definitions (e.g. modify-tag-*)
      #   policy-set-definitions/*.jsonc → initiatives grouping policies (contoso-tagging, contoso-controls)
      #   policy-assignments/*.jsonc     → where to assign, parameters, and notScope exclusions
      # Output is written to ./Output — a set of JSON plan files, not yet applied.
      - name: Build plan
        shell: pwsh
        run: |
          Build-DeploymentPlans `
            -definitionsRootFolder "." `
            -outputFolder "./Output" `
            -pacEnvironment "tenant01"

      # Save the plan so deploy-policy and deploy-roles can download it.
      # retention-days: 1 keeps storage costs minimal — plan is only needed for this run.
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output
          retention-days: 1

  # ─── JOB 2: DEPLOY POLICIES ───────────────────────────────────────────────
  # Applies the policy part of the plan to Azure:
  #   - Creates or updates custom policy definitions
  #   - Creates or updates policy set definitions (initiatives)
  #   - Creates or updates policy assignments at the contoso management group
  # Requires manual approval from a reviewer in the TENANT-DEPLOY-POLICY environment
  # before running. Waits for job 1 to complete first.
  deploy-policy:
    needs: plan
    runs-on: [self-hosted]
    environment: TENANT-DEPLOY-POLICY

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      # Download the plan produced in job 1 — Deploy-PolicyPlan reads from this folder.
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      # Pushes policy definitions, initiatives, and assignments to Azure.
      # After this step your policies are live but the Modify effect won't work
      # yet — the remediation identity needs role assignments (handled in job 3).
      - name: Deploy policy plan
        shell: pwsh
        run: Deploy-PolicyPlan -inputFolder "./Output" -pacEnvironment "tenant01"

  # ─── JOB 3: DEPLOY ROLES ──────────────────────────────────────────────────
  # Applies the role assignment part of the plan to Azure.
  # The Modify tag policies need a system-assigned managed identity with Contributor
  # rights to write tags on resources. This job creates those RBAC assignments.
  # Kept separate from job 2 so a role assignment failure cannot roll back policy
  # deployments, and so both steps can be gated independently.
  deploy-roles:
    needs: deploy-policy
    runs-on: [self-hosted]
    environment: TENANT-DEPLOY-ROLES

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      # Assigns the Contributor role to the managed identity that the Modify
      # policies use for remediation. After this step Azure will automatically
      # start tagging non-compliant resources when they are created or updated.
      - name: Deploy roles plan
        shell: pwsh
        run: Deploy-RolesPlan -inputFolder "./Output" -pacEnvironment "tenant01"
