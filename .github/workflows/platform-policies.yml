name: platform-policies

# Plan runs on every PR — no changes to Azure, just shows what would change.
# Deploy runs on merge to main — applies the plan to production.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "platform/policies/**"

jobs:
  # ─── JOB 1: PLAN ──────────────────────────────────────────────────────────
  # Reads all .jsonc files and compares them against what is currently deployed
  # in Azure. Produces a plan but makes NO changes. Runs on both PR and push.
  plan:
    runs-on: [self-hosted]
    environment: production
    outputs:
      has-changes: ${{ steps.plan-check.outputs.has-changes }}

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EPAC_PAC_OWNER_ID: ${{ secrets.EPAC_PAC_OWNER_ID }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        shell: pwsh
        run: |
          Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity
          $ctx = Get-AzContext
          Write-Host "::add-mask::$($ctx.Account.Id)"
          Write-Host "::add-mask::$env:AZURE_TENANT_ID"
          Write-Host "::add-mask::$env:EPAC_PAC_OWNER_ID"

      # Injects tenant ID and pacOwnerId from GitHub secrets into global-settings.jsonc
      # at runtime so neither value is hardcoded in the repo.
      - name: Inject secrets into global settings
        shell: pwsh
        run: |
          (Get-Content "./global-settings.jsonc") `
            -replace 'replace-at-runtime-tenant', $env:AZURE_TENANT_ID `
            -replace 'replace-at-runtime-owner', $env:EPAC_PAC_OWNER_ID |
            Set-Content "./global-settings.jsonc"

      # EPAC reads:
      #   global-settings.jsonc          → tenant, root MG scope, managed identity region
      #   policy-definitions/**/*.jsonc  → custom policy definitions (modify-tag-*)
      #   policy-set-definitions/*.jsonc → initiatives (contoso-tagging, contoso-controls)
      #   policy-assignments/*.jsonc     → assignments, parameters, notScope exclusions
      - name: Build plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Build-DeploymentPlans `
            -definitionsRootFolder "." `
            -outputFolder "./Output" `
            -pacEnvironment "tenant01"

      - name: Check if plan exists
        id: plan-check
        shell: pwsh
        run: |
          $files = Get-ChildItem "./Output" -Recurse -File -ErrorAction SilentlyContinue
          $exists = $files.Count -gt 0
          Write-Host "Plan files found: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.FullName }
          echo "has-changes=$exists" >> $env:GITHUB_OUTPUT

      - name: Debug outputs
        shell: pwsh
        run: |
          Write-Host "has-changes: ${{ steps.plan-check.outputs.has-changes }}"
          Write-Host "event_name:  ${{ github.event_name }}"
          Write-Host "ref:         ${{ github.ref }}"

      - name: Upload plan
        if: steps.plan-check.outputs.has-changes == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output
          if-no-files-found: ignore
          retention-days: 1

  # ─── JOB 2: DEPLOY ────────────────────────────────────────────────────────
  # Applies the plan to Azure. Only runs on merge to main, not on PRs.
  # Deploys policy definitions, initiatives, and assignments first, then the
  # RBAC role assignments the Modify policies need for tag remediation.
  deploy:
    needs: plan
    runs-on: [self-hosted]
    environment: production
    if: |
      needs.plan.outputs.has-changes == 'True' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.ref == 'refs/heads/main' && github.event_name == 'push')
      )

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EPAC_PAC_OWNER_ID: ${{ secrets.EPAC_PAC_OWNER_ID }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

    defaults:
      run:
        working-directory: platform/policies

    steps:
      - uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: epac-plan
          path: platform/policies/Output

      - name: Inject secrets into global settings
        shell: pwsh
        run: |
          (Get-Content "./global-settings.jsonc") `
            -replace 'replace-at-runtime-tenant', $env:AZURE_TENANT_ID `
            -replace 'replace-at-runtime-owner', $env:EPAC_PAC_OWNER_ID |
            Set-Content "./global-settings.jsonc"

      - name: Login to Azure
        shell: pwsh
        run: Connect-AzAccount -TenantId $env:AZURE_TENANT_ID -Identity

      # Pushes policy definitions, initiatives, and assignments to Azure.
      - name: Deploy policy plan
        shell: pwsh
        run: |
          Deploy-PolicyPlan `
            -inputFolder "./Output" `
            -definitionsRootFolder "." `
            -pacEnvironment "tenant01"

      # Assigns Contributor to the managed identity used by Modify policies
      # so Azure can automatically write tags on non-compliant resources.
      - name: Deploy roles plan
        shell: pwsh
        run: |
          Deploy-RolesPlan `
            -inputFolder "./Output" `
            -definitionsRootFolder "." `
            -pacEnvironment "tenant01"

      # Triggers a compliance scan so Azure evaluates all resources against the
      # newly deployed policies immediately rather than waiting for the next cycle.
      - name: Trigger compliance scan
        shell: pwsh
        run: |
          Start-AzPolicyComplianceScan `
            -ResourceGroupName $env:RESOURCE_GROUP `
            -AsJob
